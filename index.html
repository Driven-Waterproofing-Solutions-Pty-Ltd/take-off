<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProTakeoff - Takeoff Estimating Software</title>
  <link rel="icon" href="/favicon.ico" />

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      /* Forcee browser components to light mode */
    }

    body {
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      /* Prevent body scroll, handle in app */
      background-color: #f8fafc;
    }

    /* Custom scrollbar for better UI */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }

    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .react-pdf__Page__canvas {
      margin: 0 auto;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
    }

    /* Force inputs to be light themed */
    input,
    select,
    textarea {
      background-color: #ffffff;
      color: #0f172a;
      color-scheme: light;
    }
  </style>
  <!-- CDN importmap removed: every package below is in package.json and bundled by
       Vite. Resolving them from a CDN at runtime broke the app offline (React itself
       was CDN-loaded) — unacceptable for a packaged desktop/mobile app. -->
  <link rel="stylesheet" href="/index.css">
 
</head>

<body class="bg-slate-50 text-slate-900 h-screen w-screen flex flex-col">
  <div id="root" class="h-full w-full"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
