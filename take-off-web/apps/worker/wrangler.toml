name = "takeoff-worker"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Workers Builds runs this BEFORE bundling the worker. The Vite SPA build
# emits to apps/web/dist; the [assets] block below picks it up so a single
# Worker serves both the API (Hono routes) and the SPA (static fall-through).
[build]
command = "cd ../.. && pnpm install --frozen-lockfile && pnpm --filter @takeoff/web build"

# Static SPA — Workers Assets serves these on cache hit; misses fall to the
# worker's fetch handler (Hono). SPA fallback rewrites unknown paths to
# index.html so client-side routes like /login work on direct navigation.
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 database
[[d1_databases]]
binding = "DB"
database_name = "takeoff-production"
database_id = "cacd85f3-b42e-4d09-be7a-bbe11cbb2cdc"
migrations_dir = "migrations"

# R2 bucket for plan PDFs
[[r2_buckets]]
binding = "PDFS"
bucket_name = "takeoff-pdfs"

# Cron — nightly Xero contact sync
[triggers]
crons = ["0 16 * * *"] # 16:00 UTC = 02:00 AEST

# Vars set via the Workers dashboard (Settings → Variables and Secrets):
# - XERO_CLIENT_ID
# - XERO_CLIENT_SECRET
# - XERO_REDIRECT_URI
# - XERO_TOKEN_KEY           (AES-GCM key for Xero token encryption at rest)
# - MCP_BOOTSTRAP_TOKEN      (used to mint per-client MCP tokens AND to HMAC OAuth state)
# - APP_BASE_URL             (e.g. https://takeoff.drivenwp.com)
# - ANTHROPIC_API_KEY        (Phase 5 only)

[observability]
enabled = true
