[package]
name = "protakeoff_ai"
version = "0.1.0"
description = "Professional takeoff estimating software for construction projects"
authors = ["Protakeoff LLC"]
edition = "2021"
rust-version = "1.77.2"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-sql = { version = "2.0.0", features = ["sqlite"] }
tauri-plugin-store = "2.0.0"
tauri-plugin-shell = "2.0.0"
tauri-plugin-http = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Use rustls instead of the default native-tls (OpenSSL) so the crate
# cross-compiles to Android (and iOS) without a target OpenSSL build.
reqwest = { version = "0.11", default-features = false, features = ["json", "blocking", "rustls-tls"] }
machine-uid = "0.5"
rsa = "0.9"
base64 = "0.21"
tokio = { version = "1", features = ["full"] }
