name: 'Android E2E (build + render test)'

# The functional loop: builds a debug APK with VITE_E2E=1 (which makes the app
# auto-load a bundled sample PDF on startup), boots a KVM emulator, launches the
# app, and ASSERTS THE PDF ACTUALLY RENDERED (canvas has dark content, not a blank
# shell) + scans WebView logcat for JS errors. This is what proves "it works",
# not just "it builds".
#
# push trigger is a spike convenience — remove before merging to release.

on:
  workflow_dispatch:
  push:
    branches:
      - 'claude/android-apk-spike'

env:
  NDK_VERSION: '26.3.11579264'
  APP_ID: 'com.protakeoff.app'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_E2E: '1'   # frontend auto-loads the bundled sample PDF on startup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: setup Android SDK
        uses: android-actions/setup-android@v3
      - name: install Android NDK + tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: install Rust + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-android-e2e-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: install frontend deps
        run: npm install
      - name: install Tauri CLI
        run: npm install -D @tauri-apps/cli@^2
      - name: initialize Android project
        run: npx tauri android init
      - name: build debug APK (E2E)
        run: npx tauri android build --apk --debug
      - name: upload APK
        uses: actions/upload-artifact@v4
        with:
          name: protakeoff-android-e2e-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

  emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: download APK
        uses: actions/download-artifact@v4
        with:
          name: protakeoff-android-e2e-apk
          path: apk
      - name: resolve APK path
        run: |
          APK="$(find apk -name '*.apk' | head -1)"
          test -n "$APK" || { echo 'no apk'; exit 1; }
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"
          ls -lh "$APK"
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: emulator → launch → capture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disk-size: 8192M
          ram-size: 4096M
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -x
            mkdir -p artifacts
            adb wait-for-device
            adb install -r -g "$APK_PATH" || adb install -r "$APK_PATH"
            adb logcat -c || true
            adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1 || true
            sleep 45
            adb exec-out screencap -p > artifacts/screen-1.png || true
            sleep 12
            adb exec-out screencap -p > artifacts/screen-2.png || true
            adb shell pidof "$APP_ID" | tee artifacts/pid.txt || true
            adb logcat -d > artifacts/logcat-full.txt || true
            grep -iE "chromium|console|protakeoff|tauri|wry|wasm|aistudiocdn|Failed to load|\[E2E\]|FATAL|Uncaught" artifacts/logcat-full.txt > artifacts/logcat-relevant.txt || true
            echo "----- relevant log tail -----"
            tail -60 artifacts/logcat-relevant.txt || true
      - name: assert PDF rendered (canvas not blank)
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          import sys
          from PIL import Image
          img = Image.open('artifacts/screen-2.png').convert('RGB')
          w, h = img.size
          top, bot = int(h*0.12), int(h*0.97)   # skip the app header band
          px = img.load()
          dark = total = 0
          for y in range(top, bot, 3):
              for x in range(0, w, 3):
                  r, g, b = px[x, y]
                  if 0.299*r + 0.587*g + 0.114*b < 120:
                      dark += 1
                  total += 1
          frac = dark / max(total, 1)
          print(f"dark_fraction={frac:.4f} (w={w} h={h})")
          with open('artifacts/render-metric.txt', 'w') as f:
              f.write(f"dark_fraction={frac:.4f}\n")
          if frac < 0.002:
              print("RENDER ASSERT FAILED: canvas looks blank — PDF did not render")
              sys.exit(1)
          print("RENDER ASSERT PASSED: PDF content detected")
          PY
      - name: scan logcat for fatal JS/native errors
        run: |
          if grep -iE "FATAL EXCEPTION|Uncaught|aistudiocdn|AndroidRuntime: FATAL" artifacts/logcat-full.txt; then
            echo "::error::fatal error found in logcat"; exit 1
          fi
          echo "no fatal errors in logcat"
      - name: upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: artifacts/**
          if-no-files-found: warn
