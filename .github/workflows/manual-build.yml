name: 'Manual Windows Build'

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm install

      - name: Build Windows App (MSIX)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target x86_64-pc-windows-msvc --bundles msi,nsis --config src-tauri/tauri.microsoftstore.conf.json
          tagName: manual-build-v__VERSION__
          releaseName: 'Manual Build v__VERSION__'
          releaseBody: 'Manual build artifacts.'
          releaseDraft: true
          prerelease: true
